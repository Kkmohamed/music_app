name: music_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0


flutter:

  
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/ Orbitron/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/ Orbitron/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/ Orbitron/Orbitron-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ Orbitron/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/ Orbitron/Orbitron-ExtraBold.ttf
          weight: 800
        
        
        
        
    
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
